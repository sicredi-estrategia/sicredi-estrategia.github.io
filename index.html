<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma da Estratégia · beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#3FA110; --verde-escuro:#146E37; --verde-claro:#D7E6C8; --verde-lav:#F2F8ED;
  --tinta:#16261B; --texto:#404A42; --fraco:#7C867E; --tenue:#A2ABA4;
  --linha:#E4E8E4; --fundo:#F4F6F3; --branco:#FFFFFF; --nav:#0F2E1A;
  --r:12px; --sombra:0 1px 2px rgba(22,38,27,.05), 0 6px 16px rgba(22,38,27,.05);
  --sombra-alta:0 18px 48px rgba(22,38,27,.16);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fundo); color:var(--texto); font-family:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
body.travado{overflow:hidden}
h1,h2,h3,h4{font-family:"Exo 2","Segoe UI",system-ui,sans-serif; color:var(--tinta); margin:0}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
.num-exo{font-family:"Exo 2"; font-weight:700; font-variant-numeric:tabular-nums}


:root{--nav-w:252px}
.app{display:grid; grid-template-columns:var(--nav-w) 1fr; min-height:100vh; transition:grid-template-columns .26s var(--ease)}
.nav{background:var(--nav); color:#CFE0D4; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  overflow:hidden; transition:transform .26s var(--ease)}
.nav .marca{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.09);
  display:flex; align-items:center; gap:9px; min-height:66px}
.nav .marca .n1{font-family:"Exo 2"; font-weight:600; font-size:15px; color:#fff; line-height:1.12; letter-spacing:-.01em}
.marca-ico{flex:none; width:28px; height:28px; display:grid; place-items:center; background:none; border:0; padding:0; cursor:pointer; border-radius:9px}
.marca-ico:hover{box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.nav .marca .n2{font-family:"Exo 2"; font-weight:600; font-size:15px; color:#fff; line-height:1.12; letter-spacing:-.01em; text-transform:none; margin-top:0}
.nav .marca .txt{flex:1; min-width:0; overflow:hidden}
.rail-tg{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:#8FB79C;
  font-size:15px; flex:none; transition:.15s}
.rail-tg:hover{background:rgba(255,255,255,.09); color:#fff}
.badge{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:20px;
  background:rgba(255,255,255,.09); color:#8FB79C; font-weight:700; margin-left:auto; white-space:nowrap; flex:none}
.badge.viva{background:rgba(63,161,16,.26); color:#9FE07A}
.nav menu button[aria-current="true"] .badge{background:rgba(255,255,255,.24); color:#fff}
.nav .grupo{font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:#6F9179;
  padding:14px 14px 6px; font-weight:700}

body.rail{--nav-w:70px}
body.rail .nav .marca .txt,body.rail .nav menu .rot,body.rail .nav .badge,
body.rail .nav .grupo,body.rail .nav .quem .pes,body.rail .nav .quem .cracha{display:none}
body.rail .nav .marca{justify-content:center; padding:20px 0 16px}
body.rail .nav menu button{justify-content:center; padding:11px 0}
body.rail .nav .quem{text-align:center; padding:14px 0 18px}
body.rail .nav .quem .ent{font-size:0}
body.rail .nav .quem .ent::first-letter{font-size:16px}
.nav-bg{position:fixed; inset:0; background:rgba(15,32,20,.4); opacity:0; pointer-events:none;
  transition:opacity .26s var(--ease); z-index:44}
.hamb{display:none; width:28px; height:28px; border-radius:9px; align-items:center; justify-content:center;
  font-size:17px; color:var(--texto); border:1px solid var(--linha); flex:none}
.hamb:hover{border-color:var(--verde); color:var(--verde-escuro)}
.nav menu{list-style:none; margin:0; padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1}
.nav menu button{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:10px 12px; border-radius:9px; font-size:14px; font-weight:500; color:#BFD4C6; transition:background .15s, color .15s}
.nav menu button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav menu button[aria-current="true"]{background:var(--verde); color:#fff; font-weight:600}
.nav menu .ico{width:18px; height:17px; flex:none; display:grid; place-items:center}
.nav menu button{flex-wrap:wrap}
.nav menu .rot{white-space:nowrap}
.nav menu .sep{height:1px; background:rgba(255,255,255,.09); margin:10px 2px}
.nav .quem{padding:14px 18px 18px; border-top:1px solid rgba(255,255,255,.09); font-size:13px}
.nav .quem .ent{color:#fff; font-weight:700; font-family:"Exo 2"}
.nav .quem .pes{color:#8FB79C; margin-top:2px}
.nav .quem .cracha{display:inline-block; margin-top:8px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  background:rgba(63,161,16,.22); color:#9FE07A; border:1px solid rgba(63,161,16,.5); padding:2px 8px; border-radius:20px}
main{min-width:0; display:flex; flex-direction:column}


.topbar{background:var(--verde-lav); border-bottom:1px solid var(--verde-claro); padding:0 34px;
  display:flex; align-items:center; gap:18px; min-height:34px; position:sticky; top:0; z-index:30}
.trilha{font-size:12.6px; color:var(--fraco); display:flex; align-items:center; gap:8px; flex:1; min-width:0}
.trilha b{color:var(--tinta); font-weight:600}
.trilha button{color:var(--verde-escuro)}
.trilha button:hover{text-decoration:underline}
.janela{display:flex; align-items:center; gap:8px; font-size:12.4px; color:var(--verde-escuro); font-weight:600; white-space:nowrap}
.janela .pt{width:7px; height:7px; border-radius:50%; background:var(--verde)}


.passos{background:var(--branco); border-bottom:1px solid var(--linha); padding:0 34px;
  display:flex; align-items:center; gap:0; position:sticky; top:60px; z-index:29}
.passo{display:flex; align-items:center; gap:10px; padding:13px 0; font-size:13.4px; color:var(--tenue)}
.passo + .passo{margin-left:12px}
.passo .bolha{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--linha); display:grid;
  place-items:center; font-size:11.5px; font-family:"Exo 2"; font-weight:700; color:var(--tenue); transition:.2s}
.passo.atual{color:var(--tinta); font-weight:700}
.passo.atual .bolha{border-color:var(--verde); background:var(--verde); color:#fff}
.passo.feito{color:var(--verde-escuro)}
.passo.feito .bolha{border-color:var(--verde); background:var(--verde-lav); color:var(--verde-escuro)}
.passo-tr{width:26px; height:1.5px; background:var(--linha); margin:0 4px}

.corpo{padding:28px 34px 90px; max-width:1240px; width:100%}
.titulo{font-size:26px; font-weight:600; letter-spacing:-.3px; margin-bottom:7px}
.sub{color:var(--fraco); font-size:14.5px; max-width:none; margin-bottom:22px; line-height:1.55}
.aviso{display:flex; gap:10px; background:#FFFBEA; border:1px solid #F2E2A8; border-radius:var(--r);
  padding:11px 15px; font-size:12.8px; color:#6B5A17; margin-bottom:22px}


.painel{position:sticky; top:110px; z-index:25; background:var(--branco); border:1px solid var(--linha);
  border-radius:var(--r); padding:16px 20px; margin-bottom:18px; box-shadow:var(--sombra); transition:border-color .25s}
.painel.completo{border-color:var(--verde); box-shadow:0 0 0 3px rgba(63,161,16,.09), var(--sombra)}
.painel .linha{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.painel .contador{display:flex; align-items:baseline; gap:9px; min-width:0}
.painel .contador .n{font-size:30px; color:var(--tinta); line-height:1; transition:color .25s}
.painel.completo .contador .n{color:var(--verde-escuro)}
.painel .contador .t{font-size:13.2px; color:var(--fraco)}
.painel .acoes{margin-left:auto; display:flex; gap:8px; align-items:center}
.btn-t{font-size:12.6px; padding:7px 13px; border-radius:8px; border:1px solid var(--linha);
  color:var(--texto); background:var(--branco); transition:.15s; white-space:nowrap}
.btn-t:hover{border-color:var(--verde); color:var(--verde-escuro)}
.btn-p{font-size:13.4px; font-weight:700; padding:9px 18px; border-radius:8px; background:var(--verde); color:#fff;
  transition:.15s; white-space:nowrap; box-shadow:0 1px 2px rgba(20,110,55,.25)}
.btn-p:hover{background:var(--verde-escuro)}
.pilha{display:flex; height:14px; border-radius:5px; overflow:hidden; background:#EAEEE9; margin-top:13px}
.pilha div{height:100%; transition:width .45s var(--ease)}
.pilha .livre{background:repeating-linear-gradient(45deg,#EAEEE9,#EAEEE9 5px,#E0E5DF 5px,#E0E5DF 10px)}
.dica{font-size:12.2px; color:var(--tenue); margin-top:9px}


.temas{display:flex; flex-direction:column; gap:10px}
.lt{background:var(--branco); border:1px solid var(--linha); border-radius:var(--r); box-shadow:var(--sombra);
  display:grid; grid-template-columns:1fr auto; gap:22px; padding:17px 20px; align-items:center;
  transition:border-color .2s, box-shadow .2s}
.lt.ativo{border-color:var(--verde-claro)}
.lt:hover{box-shadow:0 2px 4px rgba(22,38,27,.06), 0 10px 24px rgba(22,38,27,.07)}
.lt-esq{display:flex; gap:14px; align-items:flex-start; min-width:0}
.num{flex:none; width:29px; height:29px; border-radius:8px; background:#EEF2EC; color:var(--fraco);
  font-family:"Exo 2"; font-weight:700; font-size:14px; display:grid; place-items:center; margin-top:1px; transition:.25s}
.lt.ativo .num{background:var(--verde); color:#fff}
.lt h3{font-size:17px; font-weight:600; line-height:1.3; margin-bottom:3px}
.lt .tese{color:var(--fraco); font-size:13.2px; line-height:1.45; max-width:62ch; margin-bottom:9px}
.mini{display:flex; align-items:center; gap:10px; font-size:12.6px; color:var(--fraco); flex-wrap:wrap}
.mini .nm{color:var(--texto); font-weight:600}
.mini .v{color:var(--tinta); font-family:"Exo 2"; font-weight:700; font-size:14.5px}
.delta{font-weight:700; font-size:12px; white-space:nowrap}
.delta.sobe{color:var(--verde)} .delta.desce{color:#C4364F} .delta.igual{color:var(--tenue)}
.lt-dir{display:flex; flex-direction:column; align-items:flex-end; gap:9px; flex:none}
.abrir-l{font-size:13px; font-weight:600; color:var(--verde-escuro); display:inline-flex; align-items:center; gap:5px}
.abrir-l:hover{text-decoration:underline}


.stp{display:flex; align-items:center; gap:0; border:1px solid var(--linha); border-radius:10px;
  background:var(--branco); overflow:hidden}
.stp button{width:38px; height:38px; display:grid; place-items:center; font-size:19px; color:var(--fraco);
  transition:.13s; line-height:1}
.stp button:hover:not(:disabled){background:var(--verde-lav); color:var(--verde-escuro)}
.stp button:disabled{color:#D3DAD4; cursor:not-allowed}
.stp .v{min-width:62px; text-align:center; font-family:"Exo 2"; font-weight:700; font-size:18px; color:var(--tinta);
  border-left:1px solid var(--linha); border-right:1px solid var(--linha); height:38px; line-height:38px;
  font-variant-numeric:tabular-nums}
.stp.zero .v{color:var(--tenue)}
.stp-rot{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--tenue)}
.st-linha{font-size:12.2px; color:var(--fraco); text-align:right}
.st-linha b{color:var(--verde-escuro)}


.voltar{font-size:13.4px; color:var(--verde-escuro); display:inline-flex; gap:6px; margin-bottom:15px}
.voltar:hover{text-decoration:underline}
.cabecalho{display:flex; gap:24px; align-items:flex-start; background:var(--branco); border:1px solid var(--linha);
  border-radius:var(--r); padding:22px 24px; margin-bottom:24px; box-shadow:var(--sombra); flex-wrap:wrap}
.cabecalho .txt{flex:1; min-width:280px}
.cabecalho .l1{display:flex; gap:13px; align-items:flex-start; margin-bottom:8px}
.cabecalho h2{font-size:22px; font-weight:600; line-height:1.25}
.cabecalho p{margin:0; font-size:14.4px; line-height:1.55; max-width:none}
.cabecalho .carga{flex:none; text-align:right}
.cabecalho .carga .n{font-size:34px; color:var(--tinta); line-height:1}
.cabecalho .carga .t{font-size:12.4px; color:var(--fraco); margin-top:3px}

.secao{margin-bottom:32px}
.secao-cab{display:flex; align-items:baseline; gap:11px; margin-bottom:3px}
.secao-cab h3{font-size:16.5px; font-weight:600}
.secao-cab .cnt{font-size:12.4px; color:var(--tenue)}
.secao-desc{color:var(--fraco); font-size:13.4px; margin-bottom:15px; max-width:none; line-height:1.55}


.lista{background:var(--branco); border:1px solid var(--linha); border-radius:var(--r); overflow:hidden; box-shadow:var(--sombra)}
.mr{width:100%; display:grid; grid-template-columns:1fr 90px 74px 90px 130px 20px; align-items:center; gap:16px;
  padding:15px 20px; text-align:left; border-bottom:1px solid var(--linha); transition:background .13s}
.mr:last-child{border-bottom:0}
.mr:hover{background:#FAFCF8}
.mr .n1{font-size:14.6px; font-weight:600; color:var(--tinta); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mr .n2{font-size:12.4px; color:var(--fraco); margin-top:2px; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.mr .val{font-family:"Exo 2"; font-weight:700; font-size:21px; color:var(--tinta); text-align:right; font-variant-numeric:tabular-nums}
.mr .sp{display:flex; justify-content:flex-end}
.mr .pos{font-size:12.2px; color:var(--fraco); text-align:right}
.mr .pos b{color:var(--texto); font-weight:600}
.mr .seta{color:var(--tenue); font-size:17px; text-align:right}
.mr:hover .seta{color:var(--verde-escuro)}
.tag{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:2px 7px; border-radius:4px; font-weight:700; white-space:nowrap}
.tag.principal{background:var(--verde-claro); color:var(--verde-escuro)}
.tag.estudo{background:#FFF4D6; color:#8A6D06}
.tag.local{background:#EDF0ED; color:#6B776D}
@media(max-width:1080px){ .mr{grid-template-columns:1fr 80px 66px 20px} .mr .sp,.mr .pos{display:none} }
@media(max-width:640px){ .mr{grid-template-columns:1fr 70px} .mr .seta{display:none} }


.mv{background:var(--branco); border:1px solid var(--linha); border-radius:var(--r); padding:16px 20px;
  margin-bottom:10px; box-shadow:var(--sombra); display:grid; grid-template-columns:1fr auto; gap:22px; align-items:center}
.mv.tem{border-color:var(--verde-claro)}
.mv .esq{display:flex; gap:13px; align-items:flex-start; min-width:0}
.letra{flex:none; width:27px; height:27px; border-radius:8px; background:#EEF2EC; border:1px solid var(--linha);
  color:var(--fraco); font-family:"Exo 2"; font-weight:700; font-size:13px; display:grid; place-items:center; transition:.25s}
.mv.tem .letra{background:var(--verde); border-color:var(--verde); color:#fff}
.mv h4{font-size:15px; font-weight:600; line-height:1.35; margin-bottom:4px}
.mv .desc{font-size:13px; color:var(--fraco); line-height:1.5; max-width:66ch}
.mv.local{border-style:dashed; border-color:#CBD4CC; background:#FCFDFB}
.cas{margin-top:11px; font-size:12.6px; color:var(--fraco)}
.cas .rot{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--tenue); margin-bottom:5px}
.cas ul{margin:0; padding-left:16px; color:var(--texto)}
.cas li{margin-bottom:2px}
.cas .nada{font-style:italic}
.nota{display:flex; gap:9px; background:#F5F8F4; border:1px solid var(--linha); border-radius:9px;
  padding:10px 13px; font-size:12.4px; margin-top:11px}
.nota b{color:var(--tinta)}
.add{width:100%; border:1px dashed #CBD4CC; border-radius:var(--r); background:transparent; padding:14px;
  font-size:13.4px; color:var(--verde-escuro); font-weight:600; transition:.15s}
.add:hover:not(:disabled){border-color:var(--verde); background:var(--verde-lav)}
.add:disabled{color:var(--tenue); border-color:var(--linha); cursor:not-allowed; font-weight:400}
.aviso-carga{background:#FFFBEA; border:1px solid #F2E2A8; border-radius:var(--r); padding:15px 18px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:15px; font-size:13.4px; color:#6B5A17}
.aviso-carga .n{font-size:26px; color:#6B5A17}
.resumo-carga{background:var(--branco); border:1px solid var(--linha); border-radius:var(--r); padding:14px 18px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:15px; box-shadow:var(--sombra)}
.resumo-carga .n{font-size:26px; color:var(--tinta)}
.resumo-carga .t{font-size:13.2px; color:var(--fraco)}
.resumo-carga .acoes{margin-left:auto; display:flex; gap:8px}


.rodape-nav{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:34px;
  padding-top:20px; border-top:1px solid var(--linha); flex-wrap:wrap}


.dbg{position:fixed; inset:0; background:rgba(15,32,20,.34); opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease); z-index:60; backdrop-filter:blur(1.5px)}
.dbg.on{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,92vw); background:var(--branco);
  box-shadow:var(--sombra-alta); transform:translateX(100%); transition:transform .34s var(--ease);
  z-index:61; display:flex; flex-direction:column}
.drawer.on{transform:none}
.d-cab{padding:20px 24px 16px; border-bottom:1px solid var(--linha); flex:none}
.d-cab .l1{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:5px}
.d-cab h3{font-size:18px; font-weight:600; line-height:1.3; display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.d-fechar{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:17px;
  color:var(--fraco); flex:none; transition:.13s}
.d-fechar:hover{background:var(--fundo); color:var(--tinta)}
.d-cab .mede{font-size:13px; color:var(--fraco); line-height:1.5; margin-bottom:14px}
.d-cab .numeros{display:flex; align-items:flex-end; gap:16px}
.d-cab .grande{font-family:"Exo 2"; font-weight:700; font-size:38px; color:var(--tinta); line-height:.95; letter-spacing:-1.2px}
.d-cab .lado{font-size:12.6px; color:var(--fraco); padding-bottom:4px}
.d-abas{display:flex; gap:4px; padding:10px 24px 0; border-bottom:1px solid var(--linha); flex:none}
.d-abas button{font-size:13.2px; font-weight:600; color:var(--fraco); padding:9px 14px;
  border-radius:8px 8px 0 0; border-bottom:2px solid transparent; margin-bottom:-1px; transition:.13s}
.d-abas button:hover{color:var(--verde-escuro)}
.d-abas button[aria-selected="true"]{color:var(--verde-escuro); border-bottom-color:var(--verde); background:var(--verde-lav)}
.d-corpo{padding:22px 24px; overflow-y:auto; flex:1}
.d-rot{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--tenue); margin-bottom:11px}

.barras{display:flex; flex-direction:column; gap:11px}
.barras .b{display:grid; grid-template-columns:132px 1fr 66px; align-items:center; gap:12px; font-size:13px}
.barras .trilho{height:22px; background:#EDF0EC; border-radius:6px; overflow:hidden}
.barras .fill{height:100%; border-radius:6px; transition:width .5s var(--ease)}
.barras .v{text-align:right; font-family:"Exo 2"; font-weight:700; color:var(--tinta)}
.barras .voce span:first-child{font-weight:700; color:var(--tinta)}
.faixa{margin-top:26px}
.faixa .barra{position:relative; height:32px; display:flex; border:1px solid var(--linha); border-radius:7px}
.faixa .q{flex:1; display:grid; place-items:center; font-size:10.5px; color:#96A398; border-right:1px solid var(--linha)}
.faixa .q:first-child{border-radius:6px 0 0 6px} .faixa .q:last-child{border-right:0; border-radius:0 6px 6px 0}

.cl{display:flex; flex-direction:column; gap:10px}

.fi-caixa{width:min(1080px,100%); height:min(760px, calc(100vh - 56px)); display:flex; flex-direction:column;
  background:var(--branco); border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.3); overflow:hidden}
.fi-topo{display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
  padding:24px 28px 0; flex:none}
.fi-tit{min-width:0}
.fi-olho{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--verde-escuro); font-weight:700; margin-bottom:6px}
.fi-topo h2{font-family:"Exo 2",system-ui,sans-serif; font-size:22px; color:var(--tinta);
  font-weight:600; line-height:1.2; letter-spacing:-.01em}
.fi-tese{font-size:13px; color:var(--texto); line-height:1.55; margin-top:6px; max-width:78ch}
.fi-x{width:32px; height:32px; border-radius:50%; border:1px solid var(--linha); background:var(--branco);
  color:var(--fraco); font-size:13px; cursor:pointer; flex:none; margin-top:2px}
.fi-x:hover{background:var(--fundo); color:var(--tinta)}
.fi-abas{display:flex; gap:0; padding:16px 28px 0; border-bottom:1px solid var(--linha); flex:none}
.fi-abas button{font:inherit; font-size:13px; font-weight:600; color:var(--fraco); background:none;
  border:0; border-bottom:2px solid transparent; padding:9px 14px 11px; cursor:pointer; margin-bottom:-1px}
.fi-abas button:hover{color:var(--tinta)}
.fi-abas button.on{color:var(--tinta); border-bottom-color:var(--verde)}
.fi-corpo{flex:1; min-height:0; overflow-y:auto; padding:22px 28px 24px; background:var(--fundo)}
.fi-pe{display:flex; align-items:center; justify-content:space-between; gap:20px; flex:none;
  padding:12px 28px; border-top:1px solid var(--linha); background:var(--branco)}
.fi-nota-pe{font-size:11.5px; color:var(--fraco); line-height:1.45}
.fi-vazio.grande{font-size:13.5px; color:var(--fraco); text-align:center; padding:48px 20px; line-height:1.6}


.fk-g{display:grid; gap:12px}
.fk-g1{grid-template-columns:minmax(0,1fr)}
.fk-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fk-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fk-c{background:var(--branco); border:1px solid var(--linha); border-radius:12px; padding:16px 18px;
  display:flex; flex-direction:column; min-width:0}
.fk-c.fk-solo{max-width:72ch}
.fk-r{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--verde-escuro); font-weight:700; margin-bottom:10px}
.fk-let{width:20px; height:20px; border-radius:6px; background:var(--verde); color:#fff;
  font-family:"Exo 2",system-ui,sans-serif; font-size:11px; display:grid; place-items:center; letter-spacing:0}
.fk-h{display:block; font-family:"Exo 2",system-ui,sans-serif; font-size:15px; color:var(--tinta);
  font-weight:600; line-height:1.35; margin-bottom:8px}
.fk-p{font-size:13px; color:var(--texto); line-height:1.6}
.fk-p.fraco{color:var(--fraco); font-size:12px; margin-top:10px}
.fk-ul{list-style:none; display:flex; flex-direction:column; gap:8px; margin:0; padding:0}
.fk-ul li{font-size:13px; color:var(--texto); line-height:1.5; padding-left:13px; position:relative}
.fk-ul li::before{content:""; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%;
  background:var(--verde)}
.fk-t2 .fk-r{color:#B07E12} .fk-t2 .fk-ul li::before{background:#D9A441}


.fk-num{display:flex; align-items:baseline; gap:9px; font-family:"Exo 2",system-ui,sans-serif;
  font-size:30px; color:var(--tinta); font-weight:600; line-height:1; letter-spacing:-.02em}
.fk-num span{font-size:12px; font-weight:700}
.fk-num .sobe{color:var(--verde)} .fk-num .desce{color:#C4364F} .fk-num .igual{color:var(--tenue)}
.fk-spark{margin:10px 0 12px}
.fk-c .od{margin-top:2px}
.fk-c .comp{margin-top:10px}


.fk-dl{display:flex; flex-direction:column; gap:7px; margin:12px 0 0; padding:12px 0 0;
  border-top:1px solid var(--linha)}
.fk-dl div{display:grid; grid-template-columns:82px 1fr; gap:10px; align-items:baseline}
.fk-dl dt{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--tenue); font-weight:700}
.fk-dl dd{font-size:12.5px; color:var(--texto); line-height:1.45; margin:0}


.fk-fontes{margin-top:14px; padding-top:14px; border-top:1px solid var(--linha)}
.fk-fontes .fk-r{color:var(--tenue)}
.fk-fl{display:flex; flex-wrap:wrap; gap:6px 18px}
.fk-fl span{font-size:12px; color:var(--fraco); line-height:1.5}
.fk-fl b{color:var(--texto); font-weight:600}
@media(max-width:900px){ .fk-g3,.fk-g2{grid-template-columns:1fr} .fi-caixa{height:calc(100vh - 32px)} }


.fk-c .comp-c{padding:7px 5px}
.fk-c .comp-c b{font-size:12.5px; white-space:nowrap; gap:3px}
.fk-c .comp-c .r{font-size:9px}

.fi-caixa{height:min(740px, calc(100vh - 56px))}


.fk-c .fk-r{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.fk-num{white-space:nowrap; flex-wrap:nowrap; font-size:26px}
.fk-num span{flex:none}

.fk-fant{background:transparent; border-style:dashed; border-color:#E4E8E4; gap:10px;
  justify-content:flex-start; opacity:.75}
.fk-fant .ft{display:block; background:#EEF1EC; border-radius:4px}
.fk-fant .ft-t{width:55%; height:10px}
.fk-fant .ft-v{width:40%; height:26px; margin-top:4px}
.fk-fant .ft-sp{width:100%; height:40px; margin-top:6px; border-radius:6px}
.fk-fant .ft-b{width:100%; height:14px}
.fk-fant .ft-g{width:100%; height:44px; border-radius:6px}

.tc-saber{display:inline-flex; align-items:center; gap:7px}
.tc-saber-i{width:18px; height:18px; border-radius:50%; background:var(--verde-lav); border:1px solid var(--verde-claro);
  color:var(--verde-escuro); font-style:normal; font-size:11px; font-weight:700; display:grid; place-items:center;
  flex:none; font-family:"Exo 2",system-ui,sans-serif}
.tc-saber:hover .tc-saber-i{background:var(--verde); border-color:var(--verde); color:#fff}

.nav menu button[disabled]{opacity:.45; cursor:not-allowed}
.nav menu button[disabled]:hover{background:transparent}


.p2-tema{background:var(--branco); border:1px solid var(--linha); border-radius:14px; padding:18px 20px 16px;
  margin-bottom:16px}
.p2-cab{display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:14px;
  padding-bottom:14px; border-bottom:1px solid var(--linha); flex-wrap:wrap}
.p2-tit{display:flex; gap:12px; align-items:flex-start; min-width:0}
.p2-tit h2{font-size:17px; font-weight:600; line-height:1.3}
.p2-sub{display:block; font-size:12px; color:var(--fraco); margin-top:3px}
.p2-cab .tc-saber{flex:none; margin-top:4px}
.p2-tema .mv{margin-bottom:8px}
.p2-tema .mv .dir{display:none}
.p2-tema .mv2-del{align-self:center}


.pp-topo{display:grid; grid-template-columns:1fr 300px; gap:24px; align-items:start; margin-bottom:22px}
.pp-topo .titulo{margin-bottom:6px} .pp-topo .sub{margin-bottom:0}
.mm{background:var(--branco); border:1px solid var(--linha); border-radius:12px; padding:10px 12px;
  display:flex; flex-direction:column; gap:6px; font-size:9.5px}
.mm-faixa{border:1px dashed var(--linha); border-radius:7px; padding:6px 8px; opacity:.45; transition:opacity .3s}
.mm-faixa.on{opacity:1; border-style:solid}
.mm-r{display:block; letter-spacing:.1em; text-transform:uppercase; color:var(--tenue); font-weight:700;
  font-size:8.5px; margin-bottom:4px}
.mm-ambs{display:flex; gap:4px}
.mm-ambs i{width:8px; height:8px; border-radius:50%; display:block; opacity:.25}
.mm-ambs i.on{opacity:1}
.mm-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(40px,1fr)); gap:5px}
.mm-col{border:1px solid var(--linha); border-top:2px solid var(--linha); border-radius:5px; padding:4px 5px;
  min-height:46px; background:var(--fundo)}
.mm-col.on{border-top-color:var(--c); background:var(--branco)}
.mm-col b{display:block; font-size:8.5px; color:var(--tinta); line-height:1.2; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-weight:600}
.mm-col:not(.on) b{color:var(--tenue)}
.mm-inds,.mm-movs{display:flex; gap:2px; margin-top:4px; opacity:.25}
.mm-inds.on,.mm-movs.on{opacity:1}
.mm-inds i{width:100%; height:3px; background:var(--verde-claro); border-radius:2px; max-width:14px}
.mm-movs i{width:7px; height:7px; border-radius:2px; background:#E6EBE4; border:1px solid var(--linha)}
.mm-movs i.on{background:var(--verde); border-color:var(--verde)}
.mm-leg{display:flex; gap:10px; padding-top:2px}
.mm-leg span{font-size:9px; color:var(--tenue); font-weight:600}
.mm-leg span.on{color:var(--verde-escuro)}
@media(max-width:980px){ .pp-topo{grid-template-columns:1fr} .mm{display:none} }


.nav menu .st{margin-left:auto; font-size:9.5px; flex:none; font-family:"Exo 2",system-ui,sans-serif;
  font-weight:700; letter-spacing:.08em; color:#6E9179; text-transform:uppercase}
.nav menu .st.ok{color:#8FB79C} .nav menu .st.falta{color:#D89B8A}
.nav menu .st.espera{color:#8FB79C}
.fk-entregas li{position:relative; padding-right:38px}
.fk-quem{position:absolute; right:0; top:2px; font-style:normal; font-size:9px; font-weight:700; letter-spacing:.06em; color:var(--verde-escuro); background:var(--verde-lav); border:1px solid var(--verde-claro); border-radius:4px; padding:1px 5px}
.mm-ex .mm-leg span{font-size:10.5px; letter-spacing:0; text-transform:none; color:var(--fraco)}
.nav menu .st.mes{color:#8FB79C; text-transform:uppercase; font-size:9.5px}


.inicio.ini-mapa{grid-template-columns:400px 1fr; align-items:stretch}
.inicio.ini-mapa .inicio-passos{height:100%; box-sizing:border-box}
.inicio-mapa{display:flex; flex-direction:column}
.inicio-cta.sob-mapa{margin-top:12px; flex:1}
.mm-g{padding:16px 18px; gap:10px; font-size:11px}
.mm-g .mm-r{font-size:9.5px}
.mm-g .mm-col{min-height:70px; padding:6px 7px}
.mm-g .mm-col b{font-size:10.5px}
.mm-g .mm-ambs i{width:10px; height:10px}
.mm-g .mm-movs i{width:9px; height:9px}
.mm-g .mm-leg span{font-size:10px}
.inicio-cta.sob-mapa{margin-top:12px}
@media(max-width:1100px){ .inicio.ini-mapa{grid-template-columns:1fr} .inicio-mapa .mm{display:flex; max-width:520px} }


.fw{background:var(--branco); border:1px solid var(--linha); border-radius:14px; overflow:hidden;
  box-shadow:var(--sombra)}
.fw-telhado{background:linear-gradient(#F6F9F3,#EEF4EA); padding:18px 22px 16px; text-align:center;
  border-bottom:1px solid var(--linha)}
.fw-prop{display:block; font-family:"Exo 2",system-ui,sans-serif; font-size:15px; font-weight:600;
  color:var(--verde-escuro); letter-spacing:-.01em; margin-bottom:12px}
.fw-ambs{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:7px; max-width:1040px; margin:0 auto}
.fw-a{display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; color:#fff; background:var(--a); padding:7px 8px;
  border-radius:8px; line-height:1.2; min-height:36px; text-align:center; transition:opacity .3s}
.fw-a:not(.on){opacity:.28}
.fw-casa{padding:18px 20px 10px}
.fw-cols{display:grid; grid-template-columns:repeat(var(--n,3),minmax(0,1fr)); gap:12px}
.fw-col{border:1px solid var(--linha); border-radius:10px; padding:14px 14px 12px; background:var(--branco);
  display:grid; grid-template-rows:auto auto auto var(--ih) 1fr; min-width:0; position:relative}
.fw-cols{grid-auto-rows:1fr}

.fw-col h4{min-height:auto}
.fw-tese{min-height:calc(var(--th,4) * 1.5em); -webkit-line-clamp:var(--th,4)}
.fw-col::before{content:""; position:absolute; left:0; right:0; top:0; height:4px;
  background:var(--c); border-radius:10px 10px 0 0}
.fw-amb{display:flex; gap:4px; margin:4px 0 9px}
.fw-amb i{width:8px; height:8px; border-radius:50%; display:block}
.fw-col h4{font-family:"Exo 2",system-ui,sans-serif; font-size:16px; font-weight:600; line-height:1.25;
  color:var(--tinta); margin:0 0 3px; letter-spacing:-.01em}
.fw-tese{font-size:12.2px; color:var(--texto); line-height:1.5; margin:0 0 12px;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.fw-ind{border-top:1px solid var(--linha); border-bottom:1px dashed var(--linha); padding:10px 0;
  margin-bottom:10px; overflow:hidden; box-sizing:border-box}
.fw-i{display:flex; align-items:center; gap:7px; font-size:12.2px; color:var(--texto); line-height:1.35; padding:2px 0}
.fw-i i{width:8px; height:8px; border-radius:50%; flex:none; border:2px solid var(--verde); background:#fff}
.fw-i.pr{font-weight:700; color:var(--tinta)} .fw-i.pr i{background:var(--verde)}
.fw-i.loc span{font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--verde-escuro);
  background:var(--verde-lav); border-radius:4px; padding:1px 5px; margin-left:auto}
.fw-i.vazio{color:var(--tenue); font-style:italic} .fw-i.vazio i{border-color:var(--linha)}
.fw-movs{display:flex; flex-direction:column; gap:6px; flex:1}
.fw-m{background:var(--verde-lav); border:1px solid var(--verde-claro); border-radius:7px; padding:8px 10px;
  font-size:12.2px; color:var(--texto); line-height:1.4; display:flex; gap:8px; align-items:flex-start}
.fw-m b{flex:none; font-family:"Exo 2",system-ui,sans-serif; font-size:11px; color:var(--verde-escuro); margin-top:1px}
.fw-m.vazio{background:var(--fundo); border-style:dashed; border-color:var(--linha); color:var(--tenue); font-style:italic}
.fw-chao{background:var(--verde-escuro); color:#DCEBDF; padding:12px 22px; font-size:12.5px; line-height:1.5}
.fw-chao span{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#9FE07A; margin-right:10px}
.fw-chao em{display:block; font-style:normal; font-size:11.5px; color:#A9C4AF; margin-top:4px}

.fw-cols.apertado .fw-col{padding:12px 11px 10px}
.fw-cols.apertado .fw-col h4{font-size:13.5px}
.fw-cols.apertado .fw-tese{font-size:11px}
.fw-cols.apertado .fw-i{font-size:11px}
.fw-cols.apertado .fw-m{font-size:11px; padding:7px 8px}
.fw-cols.apertado .fw-a{font-size:9.5px; padding:8px 5px}
@media(max-width:1080px){ .fw-cols{grid-template-columns:repeat(3,minmax(0,1fr))} .fw-ambs{grid-template-columns:repeat(3,1fr)} }
@media(max-width:700px){ .fw-cols{grid-template-columns:repeat(2,minmax(0,1fr))} .fw-ambs{grid-template-columns:repeat(2,1fr)} }
@media(max-width:520px){ .fw-cols{grid-template-columns:1fr} }


.mapa-topo.compacto{display:flex; align-items:center; justify-content:space-between; gap:16px;
  margin-bottom:10px; flex-wrap:wrap}
.mt-esq{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; min-width:0}
.mapa-topo.compacto .titulo{font-size:22px; margin:0}
.mt-meta{font-size:12.5px; color:var(--fraco)}
.mapa-acoes.compacto{margin-bottom:14px; gap:8px}
.mapa-acoes.compacto .btn-t,.mapa-acoes.compacto .btn-p{padding:7px 13px; font-size:12.5px}
.mapa-acoes.compacto .st-linha{font-size:12px}
.aviso.slim{padding:8px 14px; margin-bottom:10px}

.pp-olho{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--verde-escuro); font-weight:700; margin-bottom:6px}
.pp-ctx{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; font-size:12.5px}
.pp-ctx .ok{color:var(--verde-escuro); font-weight:600}
.pp-ctx .aqui{color:var(--fraco)}
.pp-topo{grid-template-columns:1fr 320px; align-items:center}

.mt-dir{display:flex; align-items:center; gap:10px; flex:none}

.nav menu .ico{color:#8FB79C; opacity:.9}
.nav menu button[aria-current="true"] .ico{color:#fff}
.nav menu button:hover .ico{color:#CFE0D4}
.nav menu button[disabled] .ico{color:#6E9179}



.ent-topo{padding:6px 14px 14px}
.ent-nome{display:block; font-family:"Exo 2",system-ui,sans-serif; font-weight:600; font-size:13px; color:#DCEBDF;
  line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ent-sub{display:block; font-size:11px; color:#8FB79C; margin-top:2px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}

.nav .quem .ent{font-size:12.8px}
.nav .quem .pes{font-size:11px}

.ent-topo{display:flex; align-items:center; gap:11px; padding:9px 12px; width:100%; margin:2px 0 10px; text-align:left; border-radius:10px; cursor:pointer; color:inherit; font:inherit;
  background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09)}
.ent-topo:hover{background:rgba(255,255,255,.09)}
.ent-topo[aria-current="true"] .ent-ico{color:#9FE07A}
.ent-ico{display:none}
body.rail .ent-ico{width:18px; height:17px; color:#8FB79C; display:grid; place-items:center; flex:none}
@media(max-width:1280px) and (min-width:1001px){ body:not(.rail-off) .ent-ico{width:18px; height:17px; color:#8FB79C; display:grid; place-items:center; flex:none} }
.ent-txt{min-width:0; flex:1}


.fw-ades{margin:2px 0 10px}
.fw-ades b{font-family:"Exo 2",system-ui,sans-serif; font-size:20px; color:var(--tinta); line-height:1; display:inline-block}
.fw-ades span{font-size:10.5px; color:var(--fraco); margin-left:6px}
.fw-ades .sis-b{margin-top:6px}
.fw-cols.sem-tese .fw-col{grid-template-rows:auto auto auto var(--ih) 1fr}
.fw-i em{margin-left:auto; font-family:"Exo 2",system-ui,sans-serif; font-style:normal; font-size:11px;
  color:var(--fraco); font-weight:600}
.fw-m.sis{align-items:center}
.fw-m.sis span{flex:1; min-width:0}
.fw-m.sis em{font-style:normal; font-family:"Exo 2",system-ui,sans-serif; font-size:11.5px; font-weight:700;
  color:var(--verde-escuro); flex:none}
.fw-leg{font-size:11px; color:var(--tenue); margin-top:12px; line-height:1.45}


.fw-cols.sem-tese .fw-i{white-space:nowrap; overflow:hidden}
.fw-cols.sem-tese .fw-i i{flex:none}
.fw-cols.sem-tese .fw-i em{flex:none}
.fw-cols.sem-tese .fw-i > :nth-child(2){overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1}
.fw-cols.sem-tese .fw-m:not(.sis) span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.35}
.fw-cols.sem-tese .fw-m{padding:6px 8px}


.nav{display:flex; flex-direction:column; height:100vh; overflow:hidden}
.nav .marca{flex:none}
.nav menu{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding-top:4px; padding-bottom:4px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent}
.nav menu::-webkit-scrollbar{width:5px}
.nav menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:3px}
.nav .quem{flex:none}

.nav menu button{padding:8px 12px}
.nav menu .sep{margin:8px 2px}
.nav .grupo-rot{padding:14px 13px 5px}
.ent-topo{padding:4px 14px 8px}
.nav .quem{padding:10px 12px 12px}
.nav .conta{padding:7px 10px}
.quem-bts{margin-top:6px}
.nav .marca{padding:14px 12px 12px 19px; min-height:0}



body.rail .nav,
body:not(.rail-off) .nav{transition:width .26s var(--ease)}
body.rail .nav{width:70px}
body.rail .nav menu .grupo-rot, body.rail .nav menu .st, body.rail .nav .ent-txt,

  const porChave=new Map();
  linhas.forEach(l=>{
    const k=l.chave_indicador||l.nome_indicador;
    if(!porChave.has(k)) porChave.set(k,[]);
    porChave.get(k).push(l);
  });
  let aplicados=0; const faltando=[];
  porChave.forEach((rows,chave)=>{
    const m=metricaPorChave(chave, rows[0].nome_indicador);
    if(!m){ faltando.push(chave); return; }
    const porMes=new Map(rows.map(r=>[r.ano_mes, r]));
    const primeiro=meses.map(am=>porMes.get(am)).find(Boolean);
    if(!primeiro) return;
    let ult=Number(primeiro.valor);
    const s=meses.map(am=>{ const r=porMes.get(am);
      if(r && r.valor!==null && r.valor!==undefined) ult=Number(r.valor);
      return +Number(ult).toFixed(2); });
    const fim=porMes.get(meses[meses.length-1])
      || rows.slice().sort((a,b)=>a.ano_mes.localeCompare(b.ano_mes)).pop();
    m.s=s;
    if(fim.mediana_central!=null) m.central=Number(fim.mediana_central);
    if(fim.mediana_sistema!=null) m.sistema=Number(fim.mediana_sistema);

function reduzirProp(chaves,get,set,quantidade){
  let resta=quantidade;
  const total=chaves.reduce((a,c)=>a+get(c),0);
  if(total<=0) return;
  chaves.forEach(c=>{ if(resta<=0) return;
    const v=get(c), corte=Math.min(v,resta,Math.round(quantidade*v/total));
    if(corte>0){ set(c,v-corte); resta-=corte; } });
  let g=0;
  while(resta>0 && g++<400){
    const mx=chaves.map(c=>({c,v:get(c)})).sort((a,b)=>b.v-a.v)[0];
    if(!mx||mx.v<=0) break; set(mx.c,mx.v-1); resta--;
  }
}
function realocar(chaves,alvo,novo,total,get,set){
  novo=Math.max(0,Math.min(total,novo)); set(alvo,novo);
  const outros=chaves.filter(c=>c!==alvo);
  const exc=outros.reduce((a,c)=>a+get(c),0)+novo-total;

}

function emBullets(txt){
  const prot=String(txt).replace(/\b(Coop|Res|Dr|Dra|Sr|Sra|aprox|vs|etc)\.\s/g,"$1\u2024 ");
  const bruto=prot.split(/(?<=[.])\s+(?=[A-ZÀ-ÚO])/).map(x=>x.replace(/\u2024/g,".").trim()).filter(Boolean);
  const partes=[];
  bruto.forEach(x=>{
    if(partes.length && x.length<30) partes[partes.length-1]+=" "+x;
    else partes.push(x);
  });
  return partes.map(x=>{
    const m=x.match(/^([^—]{3,42})\s—\s([\s\S]+)$/);
    return m ? [m[1].trim(), m[2].trim()] : [null, x];
  });
}

function deltaTexto(m,d){
  const casas=m.prefixo?m.casas:1;
  const s=(d>0?"+":d<0?"−":"")+Math.abs(d).toFixed(casas).replace(".",",");
  if(m.prefixo) return `${m.prefixo}${s}${m.un||""}`;
  if((m.un||"").trim()==="%") return `${s} p.p.`;
  return `${s} pts`;
}

  return { q1:m.sistema-meio, q3:m.sistema+meio,
           melhores: m.menorMelhor ? m.sistema-meio : m.sistema+meio };
}
function odometro(m){
  const v=ultimo(m), L=limiares(m);
  const todos=[v,m.central,m.sistema,L.q1,L.q3];
  let min=Math.min(...todos), max=Math.max(...todos);
  const folga=((max-min)||1)*0.14; min-=folga; max+=folga;
  const p=x=>Math.max(1.5,Math.min(98.5,((x-min)/(max-min))*100));
  const cores=["#EFF3EC","#DCE9D0","#B6D79B","#7FBB5E"];
  if(m.menorMelhor) cores.reverse();
  const cortes=[p(L.q1),p(m.sistema),p(L.q3)];
  const faixas=[[0,cortes[0]],[cortes[0],cortes[1]],[cortes[1],cortes[2]],[cortes[2],100]];
  return `<div class="od">
    <div class="od-barra">
      ${faixas.map(([a,b],i)=>`<span class="od-f" style="left:${a}%;width:${b-a}%;background:${cores[i]}"></span>`).join("")}
      <span class="od-nos" style="left:${p(v)}%" title="Nós: ${fmt(v,m)}"></span>
    </div>
    <div class="od-esc"><span>pior</span><span>melhor</span></div>
  </div>`;
}
function listaRefs(){
  const rot={central:"a Central", sistema:"o Sistema", melhores:"o grupo dos melhores",
             piores:"o grupo dos piores"};
  const sel=((ENTIDADE.prefs&&ENTIDADE.prefs.referencias)||["sistema"]).map(x=>rot[x]).filter(Boolean);
  if(sel.length<2) return sel[0]||"o Sistema";
  return sel.slice(0,-1).join(", ")+" e "+sel[sel.length-1];
}
function refsAtivas(m){
  const L=limiares(m), sel=(ENTIDADE.prefs&&ENTIDADE.prefs.referencias)||["central","sistema","melhores"];
  const piores = m.menorMelhor ? L.q3 : L.q1;
  const todas=[["central","Central",m.central],["sistema","Sistema",m.sistema],
               ["melhores","Melhores",L.melhores],["piores","Piores",piores]];
  const r=todas.filter(([id])=>sel.includes(id)).map(([id,rot,v])=>({id,rot,v}));
  return r.length?r:[{id:"sistema",rot:"Sistema",v:m.sistema}];
}
function celComp(m,rot,x){
  const igual=Math.abs(x)<(m.prefixo?0.5:0.05);
  const bom=(m.menorMelhor? -x : x)>0;
  const cls=igual?"igual":(bom?"sobe":"desce");
  const seta=igual?"=":(bom?"▲":"▼");
  const un=(m.un||"").trim()==="%"?" p.p.":(m.prefixo?(m.un||""):"");
  const casas=m.prefixo?m.casas:1;
  const txt=(m.prefixo||"")+Math.abs(x).toFixed(casas).replace(".",",")+un;
  return `<div class="comp-c ${cls}"><span class="r">${rot}</span>
    <b><i>${seta}</i>${txt}</b></div>`;
}

      <line x1="${ml}" y1="${py(m.central).toFixed(1)}" x2="${w-mr}" y2="${py(m.central).toFixed(1)}" stroke="#A9B4AB" stroke-width="1.5" stroke-dasharray="2 3"/>

      <circle cx="${px(s.length-1).toFixed(1)}" cy="${py(s[s.length-1]).toFixed(1)}" r="4" fill="var(--verde)" stroke="#fff" stroke-width="2"/>
      ${tk.map(i=>`<text x="${px(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#A2ABA4" font-family="Nunito">${rot[i]}</text>`).join("")}
    </svg>
    <div class="legenda">
      <span><i style="background:var(--verde);height:3px"></i>Sua cooperativa · ${delta(m,n)} no período</span>

}

const A4={ dpi:200, retrato:{w:8.27,h:11.69}, paisagem:{w:11.69,h:8.27}, margem:0.5 };

async function cssDasFontes(){
  try{
    const link=document.querySelector('link[href*="fonts.googleapis.com"]');
    if(!link) return "";
    let css=await (await fetch(link.href)).text();
    const urls=[...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))];
    for(const u of urls.slice(0,12)){
      const b=await (await fetch(u)).blob();
      const b64=await new Promise(r=>{const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b);});
      css=css.split(u).join(b64);
    }
    return css;
  }catch(e){ return ""; }
}

async function exportarPNG(){
  const arq=estado.visMapa==="arq";
  const alvo=document.querySelector(arq?".arq":".corpo > .resumo-cards")?.parentElement;
  const no=arq?document.querySelector(".arq"):document.getElementById("view");
  if(!no) return avisoExport("Nada para exportar nesta tela.",true);
  avisoExport("Gerando a imagem…");
  try{
    const orient=arq?"paisagem":"retrato";
    const larguraPag=px(A4[orient].w), alturaPag=px(A4[orient].h), margem=px(A4.margem);
    const util=larguraPag-margem*2;
    const clone=no.cloneNode(true);
    clone.querySelectorAll(".mapa-acoes,.seletor,#aviso-export").forEach(x=>x.remove());
    const larguraCSS=no.getBoundingClientRect().width;
    const cssPagina=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
    const cssFontes=await cssDasFontes();
    const envolucro=document.createElement("div");
    envolucro.setAttribute("xmlns","http://www.w3.org/1999/xhtml");
    envolucro.style.cssText=`width:${larguraCSS}px; background:#fff; padding:0; font-family:"Exo 2","Nunito",sans-serif`;
    envolucro.innerHTML=`<style>${cssFontes}\n${cssPagina}\nbody{background:#fff}</style>`;
    const cab=document.createElement("div");
    cab.style.cssText="padding:0 0 14px; margin-bottom:16px; border-bottom:2px solid #146E37;"
      +"font-family:'Exo 2',sans-serif; color:#16261B";
    cab.innerHTML=`<div style="font-size:22px;font-weight:700">Estratégia da Entidade · ${esc(ENTIDADE.nome)}</div>`
      +`<div style="font-size:13px;color:#7C867E;font-family:Nunito,sans-serif;margin-top:4px">`
      +`Ciclo ${CICLO} · ${arq?"mapa estratégico":"resumo da estratégia"} · gerado em ${new Date().toLocaleDateString("pt-BR")}</div>`;
    envolucro.appendChild(cab); envolucro.appendChild(clone);
    const medidor=document.createElement("div");
    medidor.style.cssText=`position:fixed; left:-99999px; top:0; width:${larguraCSS}px`;
    medidor.appendChild(envolucro.cloneNode(true)); document.body.appendChild(medidor);
    const alturaCSS=Math.ceil(medidor.firstChild.getBoundingClientRect().height)+8;
    medidor.remove();
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${larguraCSS}" height="${alturaCSS}">`
      +`<foreignObject width="100%" height="100%">${new XMLSerializer().serializeToString(envolucro)}</foreignObject></svg>`;
    const img=new Image();
    await new Promise((ok,falha)=>{ img.onload=ok; img.onerror=()=>falha(new Error("imagem"));
      img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); });
    const escala=util/larguraCSS;
    const alturaTotal=Math.ceil(alturaCSS*escala);
    const alturaUtil=alturaPag-margem*2;
    const paginas=Math.max(1,Math.ceil(alturaTotal/alturaUtil));
    for(let p=0;p<paginas;p++){
      const c=document.createElement("canvas");
      c.width=larguraPag; c.height=alturaPag;
      const g=c.getContext("2d");
      g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
      g.drawImage(img, 0, p*alturaUtil/escala, larguraCSS, alturaUtil/escala,
                       margem, margem, util, Math.min(alturaUtil, alturaTotal-p*alturaUtil));
      const nome=`estrategia-${ENTIDADE.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")}-${arq?"mapa":"resumo"}`
        +(paginas>1?`-p${p+1}`:"")+".png";
      const a=document.createElement("a");
      a.download=nome; a.href=c.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove();
      await new Promise(r=>setTimeout(r,350));
    }
    avisoExport(paginas>1?`${paginas} páginas A4 salvas em PNG.`:"Imagem A4 salva em PNG.");
  }catch(e){
    avisoExport("Não consegui gerar a imagem neste navegador. Use imprimir e salvar em PDF.",true);
  }
}

const N_COOPS=98;
const BASE=(function(){
  const r=rng(20270101);
  const A=["Vale do Cedro","Serra do Cerne","Campo Aberto","Águas do Norte","Pedra Alta",
    "Vale das Garças","Campo Belo","Serra Verde","Rio Bonito","Alto da Mata","Bom Retiro",
    "Vale do Lírio","Campina Nova","Serra do Sol","Porto Verde","Vale do Trigo","Ponta Clara",
    "Morro Azul","Vale da Prata","Serra Nova","Rio das Antas","Vale do Marfim",
    "Campos do Cedro","Serra do Vento","Alto Formoso","Vale do Jequitibá","Praia Nova",
    "Campo do Meio","Serra Dourada","Vale do Peroba","Ilha Verde","Cerro Claro",
    "Alto do Pinhal","Vale do Salto"];
  const B=["","Norte","Sul","Leste","Oeste","Central","Metropolitana","Vales","Missões","Fronteira"];
  const usados=new Set(), coops=[];
  for(let i=0;i<N_COOPS;i++){
    let nome;
    do{ nome="Sicredi "+A[Math.floor(r()*A.length)]+(i<A.length?"":" "+B[Math.floor(r()*B.length)]); }
    while(usados.has(nome.trim()));
    nome=nome.trim(); usados.add(nome);
    const central=CENTRAIS[Math.floor(r()*CENTRAIS.length)];
    const porte=r();                                    
    const ATRAI={1:0.62, 2:0.41, 3:0.88, 4:0.79, 5:0.34, 6:0.27};
    let temas=TEMAS.map(t=>t.id).filter(id=> r() < ATRAI[id]*(0.7+porte*0.6));
    if(temas.length<2){ temas=[3,4].slice(0,2); }
    if(temas.length>6) temas=temas.slice(0,6);
    temas.sort((x,y)=>x-y);
    const nivel={};
    temas.forEach(tid=>{
      const t=TEMAS.find(x=>x.id===tid);
      (t.movimentos||[]).forEach(m=>{
        const d=r();
        if(d<0.22) return;                               
        nivel[tid+"-"+m.l]="sim";
      });
    });
    const dl=r(); const locais = dl>0.88 ? 2 : dl>0.66 ? 1 : 0;
    const inds={};
    temas.forEach(tid=>{
      const t=TEMAS.find(x=>x.id===tid), n=(t.metricas||[]).length;
      const esc=[];
      for(let j=0;j<n;j++){ const p = j===0?0.88 : 0.52 - j*0.06; if(r()<p) esc.push(j); }
      if(!esc.length) esc.push(0);
      inds[tid]=esc;
    });
    coops.push({id:"c"+i, nome, central, porte, temas, nivel, locais, inds,
      associados:Math.round(18000+porte*260000+r()*40000), registrou:r()>0.16});
  }
  const desl={};
  coops.forEach(c=>{ desl[c.id]={}; });
  TEMAS.forEach(t=>(t.metricas||[]).forEach((m,i)=>{
    const chave=t.id+"|"+i;
    const centro=m.sistema-ultimo(m);
    coops.forEach(c=>{
      const amp=Math.max(Math.abs(m.sistema)*0.16, (Math.max(...m.s)-Math.min(...m.s))*1.5);
      const z=(r()+r()+r()-1.5)*1.2 + (c.porte-0.5)*0.5;
      desl[c.id][chave]= +(centro + z*amp*(m.menorMelhor?-1:1)).toFixed(2);
    });
  }));
  return {coops, desl};
})();
const METRICAS_TODAS=(function(){
  const o=[];
  TEMAS.forEach(t=>(t.metricas||[]).forEach((m,i)=>o.push({tid:t.id, tema:t, m, i, chave:t.id+"|"+i})));
  return o;
})();
function serieDe(entId, reg){
  const m=reg.m, n=m.s.length, u=ultimo(m);
  const desloca=(alvo,peso)=>m.s.map((v,i)=>
    +(v+(alvo-u)*(peso+(1-peso)*i/(n-1))).toFixed(2));
  if(entId==="sistema") return desloca(m.sistema,0.55);
  if(entId==="central-propria" || String(entId).startsWith("central:")) return desloca(m.central,0.62);
  const d=(BASE.desl[entId]||{})[reg.chave];
  if(d===undefined) return m.s.map(v=>v);
  return m.s.map((v,i)=>+(v+d*(0.75+0.25*i/(n-1))).toFixed(2));
}
const valorDe=(entId,reg)=>ultimo({s:serieDe(entId,reg)});
function percentilDe(entId, reg){
  if(entId===ENTIDADE.baseId && ENTIDADE.tipo==="cooperativa" && reg.m.percentil!=null)
    return reg.m.percentil;
  const v=valorDe(entId,reg);
  const todos=BASE.coops.map(c=>valorDe(c.id,reg));
  const piores=todos.filter(x=> reg.m.menorMelhor ? x>v : x<v).length;
  return Math.round(piores/todos.length*100);
}

function escoposPermitidos(){
  const t=ENTIDADE.teste ? "cas" : ENTIDADE.tipo;
  if(t==="cooperativa") return [{g:"", itens:[[ENTIDADE.baseId, ENTIDADE.nome]]}];

function adesaoTema(tid, coops){
  const dentro=coops.filter(c=>c.registrou && c.temas.includes(tid));
  const t=TEMAS.find(x=>x.id===tid), movs=(t.movimentos||[]).map(m=>m.l);
  let alto=0, medio=0, baixo=0, semNivel=0;
  dentro.forEach(c=>{
    const ns=movs.map(l=>c.nivel[tid+"-"+l]).filter(Boolean);
    if(!ns.length){ semNivel++; return; }

    if(peso>=2.4) alto++; else if(peso>=1.6) medio++; else baixo++;

function esforcoMov(tid,l,coops){

async function carregarCatalogo(){
  TEMAS.forEach(t=>(t.movimentos||[]).forEach(mv=>{ mv.cas=[]; mv.frentes=null; }));
  try{
    const c=await rpc("catalogo_ciclo",{p_ciclo:PE.ciclo}); CATALOGO=c;

    (c.temas||[]).forEach(tc=>{
      const t=TEMAS.find(x=>x.id===tc.id); if(!t) return;
      if(tc.nome) t.nome=tc.nome; if(tc.tese) t.tese=tc.tese; if(tc.origem) t.origem=tc.origem;
      if(tc.ambicoes&&tc.ambicoes.length) t.ambicoes=tc.ambicoes;
      if(tc.rotulo_mapa) TEMA_MAPA[tc.id]=tc.rotulo_mapa;
      if(tc.nome_curto) TEMA_CURTO[tc.id]=tc.nome_curto;
      (tc.movimentos||[]).forEach(mc=>{ const mv=(t.movimentos||[]).find(x=>x.l===mc.l); if(!mv) return;
        if(mc.t) mv.t=mc.t; if(mc.d) mv.d=mc.d; mv.cas=mc.cas||[]; mv.frentes=mc.frentes||null;
        if(mc.curto) MOV_CURTO[tc.id+"-"+mc.l]=mc.curto; });
      (tc.indicadores_det||[]).forEach((di,j)=>{
        const m=(t.metricas||[])[j], f=(c.fichas||{})[di.chave]; if(!m||!f) return;
        if(f.nome) m.nome=f.nome; m.curto=f.nome_curto||f.nome||m.curto;
        m.principal=!!di.principal; m.estudo=f.prontidao==="em_estudo";
      });
    });
    const agora=Date.now();
    const js=(c.janelas||[]).filter(j=>!j.central);

carregarRealizados = async function(){
  if(!AUTH || !ENTIDADE.id) return {ok:false};
  const alvo = ENTIDADE.tipo==="cas" ? "SIS" : ENTIDADE.id;
  try{
    const linhas=await rpc("serie_entidade",{p_entidade:alvo, p_meses:CONFIG_SUPABASE.meses});
    if(!linhas||!linhas.length) return {ok:false, motivo:"sem dados"};
    const eixo=[...new Set(linhas.map(l=>l.ano_mes))].sort().slice(-CONFIG_SUPABASE.meses);
    const porChave={}; linhas.forEach(l=>{ (porChave[l.chave]=porChave[l.chave]||[]).push(l); });
    Object.entries(porChave).forEach(([ch,rows])=>{
      const m=metricaPorChave(ch, rows[0].nome); if(!m) return;
      const u=rows[rows.length-1];
      if(u.casas!=null) m.casas=u.casas;
      m.prefixo=u.prefixo||""; m.un=u.sufixo||"";
      const alinhar=campo=>{ const pm=new Map(rows.map(r=>[r.ano_mes,r])); let ult=null;
        const s=eixo.map(am=>{ const r=pm.get(am); if(r&&r[campo]!=null) ult=Number(r[campo]); return ult; });
        const primeiro=s.find(x=>x!=null); return primeiro==null?null:s.map(x=>+Number(x==null?primeiro:x).toFixed(2)); };
      m.sSis=alinhar("mediana_sistema"); m.sCen=alinhar("mediana_central");
    });
    const r=aplicarRealizados(linhas.map(l=>({chave_indicador:l.chave, nome_indicador:l.nome, ano_mes:l.ano_mes, valor:l.valor,
      mediana_central:l.mediana_central, mediana_sistema:l.mediana_sistema,
      percentil: l.percentil==null ? null : (l.menor_melhor ? 100-l.percentil : l.percentil)})));   
    ancorarEntidade();
    return {ok:true, ...r};
  }catch(e){ console.warn("Indicadores não carregados", e); return {ok:false, motivo:e.message}; }

function variacao(m, v, a){

  if(ok.length<2) return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"></svg>`;
  const min=Math.min(...ok), max=Math.max(...ok), amp=(max-min)||1;
  const px=i=>(i/(v.length-1))*(w-2)+1, py=x=>h-3-((x-min)/amp)*(h-9);
  const d=caminhoComBuracos(v,px,py);
  const iU=v.map((x,i)=>ehNum(x)?i:-1).filter(i=>i>=0), i0=iU[0], iN=iU[iU.length-1];
  const contiguo=iU.length===iN-i0+1;
  const area=contiguo ? d+` L${px(iN).toFixed(1)} ${h} L${px(i0).toFixed(1)} ${h} Z` : "";
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${fill&&area?`<path d="${area}" fill="rgba(63,161,16,.10)"/>`:""}
    ${pathSe(d,`fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"`)}
    ${pontos?iU.map(i=>`<circle cx="${px(i).toFixed(1)}" cy="${py(v[i]).toFixed(1)}" r="1.6" fill="${cor}"/>`).join(""):""}
    <circle cx="${px(iN).toFixed(1)}" cy="${py(v[iN]).toFixed(1)}" r="3" fill="${cor}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
};

    const s=(z>0?"+":z<0?"−":"")+Math.abs(z).toFixed(c).replace(".",",");
    return s+(m.varTipo==="pp"?" p.p.":m.varTipo==="pontos"?" pts":"%");
  }

  return deltaTextoOriginal(m, Math.abs(d)<0.5*Math.pow(10,-casas) ? 0 : d);   
};

anelTema = function(arcos,{px=124,w=12,gap=3,apagado=false}={}){
  const c=px/2;
  const corpo=arcos.map((x,i)=>{
    const r=(px-w)/2 - 2 - i*(w+gap), C=2*Math.PI*r;
    const cor=apagado?"#C3CDC5":(COR_ARCO[i]||COR_ARCO[2]);
    const trilho=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${cor}" stroke-opacity="${apagado?".10":".13"}" stroke-width="${w}"><title>${esc(x.nome)} · ${x.rotulo?esc(x.rotulo):ehNum(x.pct)?quartilNome(x.pct):"sem posição"}</title></circle>`;
    if(!ehNum(x.pct)) return trilho;
    const pct=Math.max(2,Math.min(100,x.pct)), len=(pct/100)*C;
    const ang=(-90 + pct*3.6)*Math.PI/180;
    const kx=(c + r*Math.cos(ang)).toFixed(1), ky=(c + r*Math.sin(ang)).toFixed(1);
    return trilho+`<circle class="ring-v" cx="${c}" cy="${c}" r="${r}" fill="none"
        stroke="${cor}" stroke-width="${w}" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C-len).toFixed(1)}"
        transform="rotate(-90 ${c} ${c})"
        style="--fim:${(C-len).toFixed(1)}; --volta:${C.toFixed(1)}; animation-delay:${(i*0.12).toFixed(2)}s"
      ><title>${esc(x.nome)} · ${x.rotulo?esc(x.rotulo):`melhor que ${Math.round(x.pct)}% das cooperativas · ${quartilNome(x.pct)}`}</title></circle>
      <circle class="ring-p" cx="${kx}" cy="${ky}" r="${(w/2-1.6).toFixed(1)}" fill="#fff" stroke="${cor}" stroke-width="2"
        style="animation-delay:${(0.55+i*0.12).toFixed(2)}s"><title>${x.rotulo?esc(x.rotulo):quartilNome(x.pct)}</title></circle>`;
  }).join("");
  return `<svg viewBox="0 0 ${px} ${px}" class="ring" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="${esc(arcos.map(x=>x.nome+": "+(x.rotulo||quartilTxt(x.pct))).join(". "))}">
    <circle cx="${c}" cy="${c}" r="${c-1}" fill="${apagado?"#F7F9F6":"#F4F8F0"}"/>${corpo}</svg>`;
};
function melhoraCoops(ent, reg){
  const tp=tipoDe(ent), cen = tp==="central" ? (ehProprio(ent) ? codigoProprio() : codigoDe(ent)) : null;
  const de = tp==="central" ? "da Central" : "do Sistema";
  const pi=painelInd(reg); let n=0, N=0;
  if(pi && DR.painel && (tp==="sistema" || cen)){
    const mm = pi.menor_melhor!=null ? !!pi.menor_melhor : !!reg.m.menorMelhor;
    Object.entries(pi.valores||{}).forEach(([cod,arr])=>{
      const e=DR.entPorId.get(cod); if(!e || e.tipo!=="cooperativa" || !arr) return;
      if(cen && e.central_codigo!==cen) return;
      let i=arr.length-1; while(i>=0 && numOuNulo(arr[i])===null) i--;
      if(i<12) return;
      const v=numOuNulo(arr[i]), a=numOuNulo(arr[i-12]); if(a===null) return;
      N++; if(mm ? v<a : v>a) n++;
    });
  }
  if(!N) return {pct:null, rotulo:`nenhuma cooperativa ${de} com dado para comparar 12 meses`};
  const pct=n/N*100;
  return {pct, rotulo:`${Math.round(pct)}% das cooperativas ${de} melhoraram em 12 meses (${n} de ${N} com dado)`};
}

const crRe = s => String(s).replace(/[.*+?^${}()|[\]\\/]/g, "\\$&");
const crSoData = iso => /^\d{4}-\d{2}-\d{2}$/.test(String(iso||""));
const crFmtData = iso => !iso ? "" : crSoData(iso) ? String(iso).split("-").reverse().join("/") : fmtData(iso);
const crTempo = iso => !iso ? -Infinity : new Date(crSoData(iso) ? iso+"T12:00:00" : iso).getTime();
const crMes = iso => { if(!iso) return ""; const [a,m]=String(iso).split("-"); return (NOMES_MES[(+m||1)-1]||"")+"/"+String(a).slice(-2); };

function crJanelas(){
  const cen=crCentralCodigo();
  return ((CATALOGO&&CATALOGO.janelas)||[]).filter(j=>!j.central || (cen && j.central===cen))
    .map(j=>{ const agora=Date.now(), a=new Date(j.abre_em), f=new Date(j.fecha_em);
      return Object.assign({}, j, {st: agora<a ? "futura" : agora<f ? "aberta" : "encerrada"}); });
}
function crFraseJanela(){
  if(PLANO_SRV&&PLANO_SRV.teste) return "Simulação: este é um plano de teste, liberado sem janela e que não conta no real";
  const j=PLANO_SRV&&PLANO_SRV.janela;
  if(j) return `A janela ${j.nome} está aberta até ${fmtData(j.fecha_em)}`;
  const prox=crJanelas().filter(x=>x.st==="futura").sort((a,b)=>new Date(a.abre_em)-new Date(b.abre_em))[0];
  return prox ? `No momento não há janela aberta: a próxima (${prox.nome}) abre em ${fmtData(prox.abre_em)}`
              : "No momento não há janela aberta";
}
function crIndicadoresTemas(){ return [...new Set(((CATALOGO&&CATALOGO.temas)||[]).flatMap(t=>t.indicadores||[]))]; }

async function crCarregarCentral(){
  Object.assign(CENTRAL, {nome:"", declarou:false, temas:[], movimentos:[], registradoEm:null, natureza:null});
  CR.central="—";
  if(ENTIDADE.tipo!=="cooperativa" || !VINCULO_ATUAL || !VINCULO_ATUAL.central) return;   
  const cod=VINCULO_ATUAL.central, ent=ENTIDADE.id;
  CENTRAL.nome=VINCULO_ATUAL.central_nome||"sua Central";
  CR.central="carregando";
  try{
    const r=await rest(`vw_plano_vigente?entidade_codigo=eq.${enc(cod)}&ciclo_id=eq.${PE.ciclo}&select=conteudo,natureza,registrado_em,versao&order=versao.desc&limit=1`);
    if(ENTIDADE.id!==ent) return;                   
    const v=r&&r[0];
    if(!v || !v.conteudo){ CR.central="sem_versao"; return; }
    const temas=[], movs=[];
    ((v.conteudo.temas)||[]).forEach(t=>{
      if(t.proprio || !t.codigo) return;             
      const tc=crTemaPorCodigo(t.codigo); if(!tc) return;
      temas.push(tc.id);
      (t.movimentos||[]).forEach(mv=>{ if(!mv.proprio && mv.codigo) movs.push(k(tc.id, mv.codigo)); });
    });
    Object.assign(CENTRAL, {declarou:true, temas, movimentos:movs, registradoEm:v.registrado_em, natureza:v.natureza});
    CR.central="ok";
  }catch(e){ console.warn("Estratégia da Central não carregada", e); if(ENTIDADE.id===ent) CR.central="erro"; }
}

async function crCarregarConteudoTemas(){
  let linhas;
  try{ linhas=await rest("conteudo_tema?select=*,tema:tema_id(codigo,ordem,ciclo_id)&order=ordem"); }
  catch(e){ console.warn("Conteúdo dos temas não carregado; mantendo o texto do arquivo.", e); return; }
  linhas=(linhas||[]).filter(c=>c.tema && c.tema.ordem!=null && (c.tema.ciclo_id==null || c.tema.ciclo_id===PE.ciclo));
  if(!linhas.length) return;                         
  const por={};
  linhas.forEach(c=>{ (por[c.tema.ordem]=por[c.tema.ordem]||[]).push(c); });
  const ord=(a,b)=>(a.ordem||0)-(b.ordem||0);
  TEMAS.forEach(t=>{
    const id=+t.id, cs=(por[id]||[]).slice().sort(ord), de=tp=>cs.filter(c=>c.tipo===tp);
    const cab=de("cabecalho")[0], m=(cab&&cab.meta)||{};
    SOBRE[id]={grupo:cab?cab.titulo:null, data:m.data||null, ed:m.edicao||null,
      blocos:de("diagnostico").map(c=>[c.titulo, c.corpo_md||""]),
      fontes:de("fonte").map(c=>[c.titulo, (c.meta&&c.meta.detalhe)||"", (c.meta&&c.meta.uso)||""])};
    const res=de("resumo").map(c=>[c.titulo, Array.isArray(c.itens)?c.itens.map(String):[]]).filter(x=>x[1].length);
    if(res.length) SOBRE_CURTO[id]=res; else delete SOBRE_CURTO[id];
    const pq=de("porque"), fecho=de("porque_fecho")[0];
    PORQUE[id]={grupo:(pq[0]&&pq[0].meta&&pq[0].meta.grupo)||null, fecho:fecho?fecho.corpo_md:null,
      pontos:pq.map(c=>[c.titulo, c.corpo_md||"", (c.meta&&c.meta.fonte)||""])};
  });
  CR.conteudo=linhas.length;
}
const CR_TIPO_AN={mergulho:"Mergulho", estudo:"Estudo", painel:"Painel", escuta:"Escuta"};
function crIndDe(chave){                              
  if(!chave) return null;
  const f=(CATALOGO&&CATALOGO.fichas&&CATALOGO.fichas[chave])||{};
  const m=metricaPorChave(chave, f.nome); if(!m) return null;
  for(const t of TEMAS){ const i=(t.metricas||[]).indexOf(m); if(i>=0) return t.id+"|"+i; }
  return null;
}
async function crCarregarAnalises(){
  CR.analisesErro=null;
  let rs;
  try{ rs=await rest("analise?publicada=eq.true&select=*,tema:tema_id(ordem,ciclo_id)&order=data_ref.desc"); }
  catch(e){ console.warn("Estudos não carregados", e); CR.analisesErro=e.message; CR.analises=[]; ANALISES.splice(0,ANALISES.length); return; }
  rs=(rs||[]).filter(a=>a.publicada && a.tema && a.tema.ordem!=null && (a.tema.ciclo_id==null || a.tema.ciclo_id===PE.ciclo));
  let movs=[];
  if(rs.length){
    try{ movs=await rest(`analise_movimento?analise_id=in.(${rs.map(a=>a.id).join(",")})&select=analise_id,texto,movimento:movimento_id(codigo,tema:tema_id(ordem))`)||[]; }
    catch(e){ console.warn("Movimentos dos estudos não carregados", e); }
  }
  const lista=rs.map(a=>{
    const o={id:a.codigo||a.id, tid:+a.tema.ordem, tipo:CR_TIPO_AN[a.tipo]||a.tipo||"Estudo",
      data:crMes(a.data_ref), dataIso:a.data_ref, fonte:a.fonte||"Grupo de Tema", titulo:a.titulo||"", resumo:a.resumo||"",
      recortes:(Array.isArray(a.recortes)?a.recortes:[]).filter(r=>r&&Array.isArray(r.itens)&&r.itens.length),
      achados:Array.isArray(a.achados)?a.achados:[], chave:a.indicador_chave||null,
      atacar:movs.filter(x=>x.analise_id===a.id && x.movimento && x.movimento.tema)
                 .map(x=>({mov:x.movimento.tema.ordem+"-"+x.movimento.codigo, txt:x.texto||""}))};
    Object.defineProperty(o, "ind", {get(){ return crIndDe(this.chave); }, enumerable:true});   
    return o;
  });
  ANALISES.splice(0, ANALISES.length, ...lista);
  CR.analises=lista.length;
}

function paraCoopDoFront(p){

  const central = (ENTIDADE && ENTIDADE.tipo==="central" && p.central_codigo===ENTIDADE.id) ? ENTIDADE.nome : (p.central||"");
  const inds={}; Object.entries(p.inds||{}).forEach(([k,v])=>{ inds[Number(k)]=(v||[]).map(Number); });
  return {id:String(p.id), nome:p.nome||"", central, central_codigo:p.central_codigo, tipo:"cooperativa",
    temas:(p.temas||[]).map(Number).filter(n=>!isNaN(n)), nivel:Object.assign({},p.nivel||{}), inds,
    locais:Number(p.locais)||0, movs_proprios:Number(p.movs_proprios)||0,
    situacao:p.situacao, concluida, andamento, com_conteudo:!!p.com_conteudo, anonima:!!p.anonima,
    atualizado_em:p.atualizado_em||null, registrou:concluida||andamento, porte:0.5, associados:0};
}
function aplicarPanorama(linhas){
  PANORAMA=Array.isArray(linhas)?linhas:[];
  const coops=PANORAMA.filter(p=>p.tipo==="cooperativa").map(paraCoopDoFront)
    .sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  BASE.coops.splice(0, BASE.coops.length, ...coops);
  const nomes=new Set();
  PANORAMA.forEach(p=>{ if(p.tipo==="central" && p.central) nomes.add(p.central); });
  coops.forEach(c=>{ if(c.central) nomes.add(c.central); });
  if(ENTIDADE && ENTIDADE.tipo==="central"){
    const minha=PANORAMA.find(p=>p.tipo==="central" && p.central_codigo===ENTIDADE.id);
    if(minha && minha.central) nomes.delete(minha.central);
    nomes.add(ENTIDADE.nome);
  }
  CENTRAIS.splice(0, CENTRAIS.length, ...[...nomes].sort((a,b)=>a.localeCompare(b,"pt-BR")));
}
function carregarPanorama(opcoes){
  const forcar=!!(opcoes&&opcoes.forcar);
  if(!AUTH || !ENTIDADE || !ENTIDADE.id) return Promise.resolve(PANORAMA);
  if(ENTIDADE.tipo==="cooperativa" && !ENTIDADE.teste) return Promise.resolve(PANORAMA);
  if(PANORAMA_ST.carregando) return PANORAMA_ST.carregando;
  if(!forcar && PANORAMA && PANORAMA_ST.entidade===ENTIDADE.id && PANORAMA_ST.em && Date.now()-PANORAMA_ST.em<20000)
    return Promise.resolve(PANORAMA);
  const ent=ENTIDADE.id;
  PANORAMA_ST.carregando=rpc("panorama_sistemico",{p_ciclo:PE.ciclo})
    .then(linhas=>{
      if(ENTIDADE.id!==ent) return PANORAMA;                 
      aplicarPanorama(linhas);
      PANORAMA_ST.erro=null; PANORAMA_ST.em=Date.now(); PANORAMA_ST.entidade=ent;
      return PANORAMA;
    })
    .catch(e=>{ console.warn("Panorama sistêmico não carregado", e); PANORAMA_ST.erro=e.message||String(e); return PANORAMA; })
    .finally(()=>{ PANORAMA_ST.carregando=null; });
  return PANORAMA_ST.carregando;
}

function evoBaseDe(ref,comp){ if(comp==="aa") return evoAdd(ref,-12); if(comp==="dez") return evoYm(evoParse(ref).y-1,12); return evoAdd(ref,-3); }

function evoPasso(m,serie,am,p){

function evoSeq(m,serie,ref,modo){

function svgDuasBarras(m, a, b, w, opts){

function escGrafico(d, m){

    return meses.map(mm => mp.get(mm) || {mes:mm, n:0, mediana:null, p25:null, p75:null}); };
  const S = {}; ESC_GRUPOS.forEach(([g]) => { S[g] = serie(g); });
  const vals = [];
  ESC_GRUPOS.forEach(([g]) => S[g].forEach(x => { if(escNum(x.mediana)) vals.push(Number(x.mediana)); }));
  S.escolheram.forEach(x => { if(escNum(x.p25)) vals.push(Number(x.p25)); if(escNum(x.p75)) vals.push(Number(x.p75)); });
  const fechar = `<button class="btn-t mini esc-fechar" onclick="event.stopPropagation();ESC.aberto=null;pinta()">Fechar</button>`;
  if(!N || !vals.length){
    ESC.graf = null;
    return `<div class="esc-det-cab"><b>${esc(m.curto)}</b>${fechar}</div>
      <p class="esc-carregando">Nenhum grupo tem 3 ou mais cooperativas com dado nestes meses: não há série para desenhar.</p>`;
  }
  const min = Math.min(...vals), max = Math.max(...vals);
  const folga = ((max-min) || Math.abs(max) || 1) * 0.08, lo = min-folga, hi = max+folga;
  const X = i => N===1 ? 50 : i/(N-1)*100;                         
  const Y = v => 100 - (v-lo)/(hi-lo)*100;                          
  const caminho = s => { let p = "", caneta = false;
    s.forEach((x, i) => { if(escNum(x.mediana)){ p += (caneta ? "L" : "M") + (X(i)*10).toFixed(1) + " " + Y(Number(x.mediana)).toFixed(2) + " "; caneta = true; } else caneta = false; });
    return p.trim(); };

    if(seg.length > 1){
      const cima = seg.map(i => (X(i)*10).toFixed(1) + " " + Y(Number(S.escolheram[i].p75)).toFixed(2));
      const baixo = seg.slice().reverse().map(i => (X(i)*10).toFixed(1) + " " + Y(Number(S.escolheram[i].p25)).toFixed(2));
      faixa += "M" + cima.join(" L") + " L" + baixo.join(" L") + " Z ";

  S.escolheram.forEach((x, i) => { if(escNum(x.p25) && escNum(x.p75)) seg.push(i); else fechaSeg(); });

  const fins = ESC_GRUPOS.map(([g]) => { const s = S[g]; for(let i = s.length-1; i >= 0; i--) if(escNum(s[i].mediana))
      return `<i class="esc-fim ${ESC_COR[g]}" style="left:${X(i).toFixed(2)}%;top:${Y(Number(s[i].mediana)).toFixed(2)}%"></i>`;
    return ""; }).join("");
  const nCoops = g => Number((G[g] || {}).cooperativas) || 0;
  const legenda = ESC_GRUPOS.map(([g, rot]) => `<span><svg width="26" height="8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" class="esc-ln ${ESC_COR[g]}"/></svg>${rot}
      <small>${nCoops(g)} ${escPlural(nCoops(g), "coop", "coops")}</small></span>`).join("")
    + `<span><i class="esc-sw-faixa" aria-hidden="true"></i>Faixa p25–p75 de quem escolheu</span>`;
  return `<div class="esc-det-cab"><b>${esc(m.curto)}</b><span>Mediana mês a mês${m.nome && m.nome!==m.curto ? ` · ${esc(m.nome)}` : ""}</span>${fechar}</div>
    <p class="esc-leitura">${escLeitura(S, m)}</p>
    <div class="esc-graf" onclick="event.stopPropagation()">

const ESC_COR = {escolheram:"g-esc", nao_escolheram:"g-nao", sem_plano:"g-sem"};
function escLeitura(S, m){
  const parte = ([g, , quem], periodo) => {
    const s = S[g]; let iu = -1;
    for(let i = s.length-1; i >= 0; i--) if(escNum(s[i].mediana)){ iu = i; break; }
    if(iu < 0) return `${quem}: sem número (${ESC_SEM_NUMERO})`;
    const u = s[iu], a = s.find(x => x.mes===escMes12Antes(u.mes));
    if(!a || !escNum(a.mediana)) return `${quem}: ${fmt(Number(u.mediana), m)} em ${rotuloMes(u.mes)} (sem leitura 12 meses antes)`;
    return `${quem}: ${fmt(Number(a.mediana), m)} → ${fmt(Number(u.mediana), m)}${periodo ? " em 12 meses" : ""}`;
  };
  const txt = parte(ESC_GRUPOS[0], true) + "; " + parte(ESC_GRUPOS[1], false) + ".";
  return esc(txt.charAt(0).toUpperCase() + txt.slice(1));
}
function escDica(ev){
  const gf = ESC.graf, el = ev.currentTarget; if(!gf || !el) return;
  const r = el.getBoundingClientRect(), N = gf.meses.length; if(!r.width || !N) return;
  const i = Math.max(0, Math.min(N-1, Math.round((ev.clientX - r.left) / r.width * (N-1))));
  const x = gf.X(i);
  const guia = el.querySelector(".esc-guia"); guia.hidden = false; guia.style.left = x + "%";
  el.querySelectorAll(".esc-ponto").forEach(p => {
    const v = gf.S[p.dataset.g][i];
    if(v && escNum(v.mediana)){ p.hidden = false; p.style.left = x + "%"; p.style.top = gf.Y(Number(v.mediana)) + "%"; }
    else p.hidden = true;
  });
  const dica = el.querySelector(".esc-dica");
  dica.innerHTML = `<b>${esc(rotuloMes(gf.meses[i]))}</b>` + ESC_GRUPOS.map(([g, rot]) => {
    const v = gf.S[g][i] || {}, n = Number(v.n) || 0;
    return `<span><i class="esc-sw ${ESC_COR[g]}"></i>${rot}: ${escNum(v.mediana)
      ? `<b>${esc(fmt(Number(v.mediana), gf.m))}</b> · n ${n}` : `— <small>(${n} com dado)</small>`}</span>`;
  }).join("");

  const px = x/100*r.width, w = dica.offsetWidth, graf = el.closest(".esc-graf");

  let L = px + 12;
  if(L + w > dir) L = px - 12 - w;

function escDicaFora(el){

function escTextoJanela(){
